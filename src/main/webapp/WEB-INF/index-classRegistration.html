<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/css/classRegistration.css">
    <link rel="stylesheet" href="../static/css/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
    <script src="../static/js/script-classRegistration.js"></script>
    <title>클래스 등록</title>
</head>
<body>
    <!-- Header 영역 -->
    <header class="header">
        <div class="header-container">
            <!-- 로고 영역 -->
            <div class="logo">
                <div class="logo-img">
                    <img src="../static/img/mainlogo.png" alt="logoimg">
                </div>
                <div class="logo-text">로고</div>
            </div>

            <!-- 모바일 메뉴 -->
            <button class="mobile-menu-toggle" aria-label="메뉴 열기" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    
    <!-- Main Content 영역 -->
    <div class="container">
    <h1>강의 등록</h1>
    <form class="lecture-form">
      <!-- 강의 기본 정보 -->
      <div class="form-group">
        <label for="className">강의명</label>
        <input type="text" id="className" name="className" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="description">강의 상세설명</label>
        <textarea id="description" name="description" placeholder="강의에 대한 상세 설명을 입력하세요" required></textarea>
      </div>

      <div class="form-group inline">
        <div>
          <label for="price">가격</label>
          <input type="number" id="price" name="price" placeholder="" min="0" required>
        </div>
        <div>
          <label for="category">카테고리</label>
          <select id="category" name="category" required>
            <option value="">선택하세요</option>
            <option value="painting">그림</option>
            <option value="pottery">도자기</option>
            <option value="baking">베이킹</option>
            <option value="cooking">요리</option>
            <option value="flower">플라워</option>
            <option value="metalworking">금속공예</option>
            <option value="bookmaking">책만들기</option>
          </select>
        </div>
      </div>

      <!-- 이미지 업로드 -->
      <div class="form-group">
        <label for="mainImage">대표이미지</label>
        <div class="image-drop-zone" id="imageDropZone">
          <div class="drop-text">이미지를 드래그하여 업로드하거나 클릭하여 선택하세요</div>
          <input type="file" id="mainImage" name="mainImage" accept="image/*" required style="display: none;">
        </div>
      </div>

      <!-- 추가 이미지 업로드 -->
      <div class="form-group">
        <label for="additionalImages">추가 이미지 (최대 4개)</label>
        <div class="additional-images-container">
          <div class="additional-image-slot" data-index="0">
            <div class="image-drop-zone additional-drop-zone" id="additionalDropZone0">
              <div class="drop-text">+</div>
              <input type="file" id="additionalImage0" name="additionalImages" accept="image/*" style="display: none;">
            </div>
          </div>
          <div class="additional-image-slot" data-index="1">
            <div class="image-drop-zone additional-drop-zone" id="additionalDropZone1">
              <div class="drop-text">+</div>
              <input type="file" id="additionalImage1" name="additionalImages" accept="image/*" style="display: none;">
            </div>
          </div>
          <div class="additional-image-slot" data-index="2">
            <div class="image-drop-zone additional-drop-zone" id="additionalDropZone2">
              <div class="drop-text">+</div>
              <input type="file" id="additionalImage2" name="additionalImages" accept="image/*" style="display: none;">
            </div>
          </div>
          <div class="additional-image-slot" data-index="3">
            <div class="image-drop-zone additional-drop-zone" id="additionalDropZone3">
              <div class="drop-text">+</div>
              <input type="file" id="additionalImage3" name="additionalImages" accept="image/*" style="display: none;">
            </div>
          </div>
        </div>
      </div>

      <!-- 수용 인원 -->
      <div class="form-group">
        <label for="capacity">수용 인원</label>
        <input type="number" id="capacity" name="capacity" placeholder="예: 30" min="0" required>
      </div>

      <!-- 날짜 및 시간 -->
      <div class="form-group inline">
        <div>
          <label for="startDate">시작 날짜</label>
          <input type="date" id="startDate" name="startDate" required>
        </div>
        <div>
          <label for="endDate">끝 날짜</label>
          <input type="date" id="endDate" name="endDate" required>
        </div>
      </div>

      <div class="form-group inline">
        <div>
          <label for="startTime">시작 시간</label>
          <input type="time" id="startTime" name="startTime" required>
        </div>
        <div>
          <label for="endTime">끝 시간</label>
          <input type="time" id="endTime" name="endTime" required>
        </div>
      </div>

      <!-- 주소 -->
      <div class="form-group">
        <label for="address">주소</label>
        <input type="text" id="address" name="address" placeholder="예: 서울특별시 강남구 테헤란로 123" required>
      </div>

      <div class="form-group">
        <label for="detailAddress">상세 주소</label>
        <input type="text" id="detailAddress" name="detailAddress" placeholder="예: 3층 A강의실">
      </div>

      <!-- 제출 버튼 -->
      <button type="submit" class="submit-btn">등록하기</button>
    </form>
  </div>


     <!-- Footer 영역 -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-top">
                <!-- 로고 프레임 -->
                <div class="footer-logo-frame">
                    <div class="footer-logo">로고</div>
                    <div class="footer-info">웹사이트 정보</div>
                </div>

                <!-- 고객센터, 운영시간, 연락처 -->
                <div class="footer-contents">
                    <p>고객센터</p>
                </div>
                <div class="footer-contents">
                    <p>운영시간</p>
                    평일/주말 <br>
                    10:00 - 17:00<br>
                    (점심 : 12:00 - 13:00)
                </div>
                <div class="footer-contents">
                    <p>연락처</p>
                    010-1234-5678<br>
                    oneday@class.com
                </div>
            </div>

            <hr>

            <div class="footer-down">
                <!-- 이용약관, 사업자 정보 -->
                <div class="footer-contents">
                    <P>사업자 정보</P>
                    사업자 등록번호: 123-45-67890<br>
                    대표자: 홍길동<br>
                    주소: 서울특별시 강남구 테헤란로 123, 45
                </div>

                <div class="footer-contents">
                    <P>이용약관</P>
                    개인정보처리방침
                </div>
            </div>
        </div>
    </footer>

    <!-- 모바일 메뉴 모달 -->
    <div id="mobileMenuModal" class="mobile-menu-modal">
        <div class="mobile-menu-modal-content">
            <div class="mobile-menu-header">
                <h2>원데이클래스</h2>
                <button id="closeMobileMenu" class="close">></button>
            </div>
            <!-- 빈 컨텐츠 영역 -->
            <div class="mobile-menu-empty">
                <p>메뉴가 곧 추가될 예정입니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
