<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/teacherMypage.css">
    <title>Teacher Mypage</title>
</head>
<body>
    <!-- Header 영역 -->
    <header class="header">
        <div class="header-container">
            <!-- 로고 영역 -->
            <div class="logo">
                <div class="logo-img">
                    <img src="../static/img/mainlogo.png" alt="logoimg">
                </div>
                <div class="logo-text">로고</div>
            </div>

            <!-- 마이페이지 아이콘 영역 -->
            <div class="mypage-icons">
                <div class="icons">
                    <!-- 강사 아이콘 -->
                    <button type="button" class="mypage-icon icon-teacher">
                        <img src="../static/img/mypage-icon-teacher.png" alt="icon-teacher">
                    </button>

                    <!-- 학생 아이콘 -->
                    <button type="button" class="mypage-icon icon-student">
                        <img src="../static/img/mypage-icon-student.png" alt="icon-student">
                    </button>
                </div>
            </div>

            <!-- 모바일 메뉴 (선택사항) -->
            <button class="mobile-menu-toggle" aria-label="메뉴 열기" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>


     <!-- Footer 영역 -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-top">
                <!-- 로고 프레임 -->
                <div class="footer-logo-frame">
                    <div class="footer-logo">로고</div>
                    <div class="footer-info">웹사이트 정보</div>
                </div>

                <!-- 고객센터, 운영시간, 연락처 -->
                <div class="footer-contents">
                    <p>고객센터</p>
                </div>
                <div class="footer-contents">
                    <p>운영시간</p>
                    평일/주말 <br>
                    10:00 - 17:00<br>
                    (점심 : 12:00 - 13:00)
                </div>
                <div class="footer-contents">
                    <p>연락처</p>
                    010-1234-5678<br>
                    oneday@class.com
                </div>
            </div>

            <hr>

            <div class="footer-down">
                <!-- 이용약관, 사업자 정보 -->
                <div class="footer-contents">
                    <P>사업자 정보</P>
                    사업자 등록번호: 123-45-67890<br>
                    대표자: 홍길동<br>
                    주소: 서울특별시 강남구 테헤란로 123, 45
                </div>

                <div class="footer-contents">
                    <P>이용약관</P>
                    개인정보처리방침
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
