version: "3.9"
services:
  web:
    build: .
    image: ${ONEDAY_IMAGE}
    container_name: oneday
    ports:
      - "8080:8080"
    restart: always
  mysql:
    image: mysql:8.0
    container_name: oneday_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CHARACTER_SET_SERVER: ${MYSQL_CHARACTER_SET_SERVER}
      MYSQL_COLLATION_SERVER: ${MYSQL_COLLATION_SERVER}
      TZ: ${TZ}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tableV3.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=${MYSQL_CHARACTER_SET_SERVER}
      - --collation-server=${MYSQL_COLLATION_SERVER}
      - --default-time-zone=+09:00
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
